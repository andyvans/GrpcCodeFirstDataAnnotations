name: .NET Core

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0
    - name: Build with dotnet
      working-directory: src
      run: dotnet build --configuration Release
